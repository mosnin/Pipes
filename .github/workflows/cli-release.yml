name: CLI Release

on:
  push:
    tags:
      - 'cli/v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: pipes-linux-x64
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: pipes-macos-arm64
          - os: macos-13
            target: bun-darwin-x64
            artifact: pipes-macos-x64
          - os: windows-latest
            target: bun-windows-x64
            artifact: pipes-win-x64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: packages/cli
        run: bun install

      - name: Build binary
        working-directory: packages/cli
        run: bun build --compile --target=${{ matrix.target }} src/index.ts --outfile dist/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: packages/cli/dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pipes-linux-x64/pipes-linux-x64
            dist/pipes-macos-arm64/pipes-macos-arm64
            dist/pipes-macos-x64/pipes-macos-x64
            dist/pipes-win-x64.exe/pipes-win-x64.exe
          generate_release_notes: true
          draft: false
